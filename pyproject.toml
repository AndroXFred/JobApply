[project]
name = "jobapply"
version = "0.1.0"
description = "Personal remote-job search pipeline: find, evaluate, tailor, and (with your approval) apply."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "apscheduler>=3.10,<4",
    "openai>=1.50",
    "httpx>=0.27",
    "weasyprint>=62",
    "pyyaml>=6.0",
    "playwright>=1.48",
    "bcrypt>=4.0",
    "python-docx>=1.1",
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "fpdf2>=2.7",  # test-fixture PDF generation only, not used at runtime
]

[project.scripts]
jobapply = "jobapply.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobapply*"]

[tool.ruff]
line-length = 100
target-version = "py311"
