<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}JobApply{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.3" defer></script>
  <style>
    :root {
      color-scheme: light dark;
      --fg: #1a1a1a; --bg: #fafafa; --card: #ffffff; --border: #e0e0e0;
      --accent: #2563eb; --muted: #6b7280; --danger: #dc2626; --ok: #16a34a;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #e5e5e5; --bg: #121212; --card: #1c1c1c; --border: #2e2e2e; --muted: #9ca3af; }
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--fg); margin: 0;
    }
    nav {
      display: flex; align-items: center; gap: 1.5rem; padding: 0.75rem 1.5rem;
      border-bottom: 1px solid var(--border); background: var(--card);
    }
    nav a { color: var(--fg); text-decoration: none; font-size: 0.95rem; }
    nav a:hover { color: var(--accent); }
    nav .brand { font-weight: 600; margin-right: auto; }
    main { max-width: 1000px; margin: 0 auto; padding: 1.5rem; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      padding: 1rem 1.25rem; margin-bottom: 1rem;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    th { color: var(--muted); font-weight: 500; }
    .badge {
      display: inline-block; padding: 0.15rem 0.5rem; border-radius: 999px;
      font-size: 0.75rem; font-weight: 600; background: var(--border);
    }
    .badge-pursue, .badge-pending_tailor, .badge-pending_approval, .badge-approved, .badge-applied { background: #d1fae5; color: #065f46; }
    .badge-rejected, .badge-apply_failed, .badge-rejected_by_human, .badge-tailoring_failed, .badge-evaluation_failed { background: #fee2e2; color: #991b1b; }
    .badge-new, .badge-evaluated, .badge-applying { background: #dbeafe; color: #1e40af; }
    form.inline { display: inline; }
    button, input[type=submit] {
      background: var(--accent); color: white; border: none; border-radius: 6px;
      padding: 0.5rem 1rem; font-size: 0.9rem; cursor: pointer;
    }
    button.secondary { background: transparent; color: var(--fg); border: 1px solid var(--border); }
    input, select {
      background: var(--card); color: var(--fg); border: 1px solid var(--border);
      border-radius: 6px; padding: 0.5rem; font-size: 0.9rem;
    }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.25rem; }
    .field { margin-bottom: 1rem; }
    .muted { color: var(--muted); font-size: 0.85rem; }
    .flash { padding: 0.6rem 1rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.9rem; }
    .flash-error { background: #fee2e2; color: #991b1b; }
    .flash-ok { background: #d1fae5; color: #065f46; }
  </style>
</head>
<body>
  <nav>
    <span class="brand">JobApply</span>
    {% if user_id %}
      <a href="/jobs">Jobs</a>
      <a href="/settings">Settings</a>
      <form class="inline" method="post" action="/logout"><button type="submit" class="secondary">Log out</button></form>
    {% endif %}
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
