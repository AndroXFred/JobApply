<!doctype html>
<html>
<body>
  <h1>Staff Engineer</h1>
  <button id="apply-btn">Apply for this job</button>

  <form id="app-form" style="display:none;">
    <label for="first_name">First Name</label>
    <input id="first_name" name="first_name" type="text" required>

    <label for="last_name">Last Name</label>
    <input id="last_name" name="last_name" type="text" required>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" required>

    <label for="resume">Resume/CV</label>
    <input id="resume" name="resume" type="file" required>

    <button type="submit" id="submit_app">Submit Application</button>
  </form>
  <div id="confirmation" style="display:none;">Thank you for applying!</div>

  <script>
    document.getElementById('apply-btn').addEventListener('click', function () {
      document.getElementById('apply-btn').style.display = 'none';
      document.getElementById('app-form').style.display = 'block';
    });
    document.getElementById('app-form').addEventListener('submit', function (e) {
      e.preventDefault();
      document.getElementById('app-form').style.display = 'none';
      document.getElementById('confirmation').style.display = 'block';
    });
  </script>
</body>
</html>
