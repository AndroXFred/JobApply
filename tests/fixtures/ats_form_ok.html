<!doctype html>
<html>
<body>
  <h1>Apply for Staff Engineer</h1>
  <form id="app-form">
    <label for="first_name">First Name</label>
    <input id="first_name" name="first_name" type="text" required>

    <label for="last_name">Last Name</label>
    <input id="last_name" name="last_name" type="text" required>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" required>

    <label for="phone">Phone</label>
    <input id="phone" name="phone" type="tel" required>

    <label for="resume">Resume/CV</label>
    <input id="resume" name="resume" type="file" required>

    <label for="cover_letter">Cover Letter</label>
    <textarea id="cover_letter" name="cover_letter"></textarea>

    <label for="linkedin">LinkedIn URL</label>
    <input id="linkedin" name="linkedin" type="url">

    <button type="submit" id="submit_app">Submit Application</button>
  </form>
  <div id="confirmation" style="display:none;">Thank you for applying! We've received your application.</div>
  <script>
    document.getElementById('app-form').addEventListener('submit', function (e) {
      e.preventDefault();
      document.getElementById('app-form').style.display = 'none';
      document.getElementById('confirmation').style.display = 'block';
    });
  </script>
</body>
</html>
